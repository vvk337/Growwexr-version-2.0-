<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/assets/Growwezy-G-Square.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#020713" />

    <!-- Default title + description (overridden per-page by useSEO hook) -->
    <title>Growwezy Global Tech | Forex Advisory &amp; Asset Management</title>
    <meta name="description" content="Forex trading advisory and financial asset management services for NRIs and international clients across the UAE and Middle East. Clearer Perspective. Informed Forex Decisions." />
    <meta name="robots" content="index,follow,max-snippet:-1,max-image-preview:large,max-video-preview:-1" />

    <!-- Default Canonical (overridden per-page) -->
    <link rel="canonical" href="https://growwezy.com/" />

    <!-- Open Graph defaults (overridden per-page by useSEO hook) -->
    <meta property="og:site_name" content="Growwezy Global Tech" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Growwezy Global Tech | Forex Advisory &amp; Asset Management" />
    <meta property="og:description" content="Forex trading advisory and financial asset management services for NRIs and international clients across the UAE and Middle East." />
    <meta property="og:url" content="https://growwezy.com/" />
    <meta property="og:image" content="https://growwezy.com/assets/og-growwezy.jpg" />
    <meta property="og:image:alt" content="Growwezy Global Tech – Forex Advisory" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card defaults (overridden per-page by useSEO hook) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@teamgrowwezy" />
    <meta name="twitter:title" content="Growwezy Global Tech | Forex Advisory &amp; Asset Management" />
    <meta name="twitter:description" content="Forex trading advisory and financial asset management services for NRIs and international clients across the UAE and Middle East." />
    <meta name="twitter:image" content="https://growwezy.com/assets/og-growwezy.jpg" />

    <!-- Performance: DNS Prefetch & Preconnect for critical origins -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    <link rel="dns-prefetch" href="https://fonts.gstatic.com">
    <link rel="dns-prefetch" href="https://images.unsplash.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin>

    <!-- Preload brand logo to avoid flash of missing logo -->
    <link rel="preload" href="/assets/Growwezy-Global-Tech-HD.svg" as="image" type="image/svg+xml">

    <!-- Non-render-blocking modern typography -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" media="print" onload="this.media='all'">
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
