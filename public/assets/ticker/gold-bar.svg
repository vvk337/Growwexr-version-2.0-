<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="30" height="30" fill="none">
  <defs>
    <!-- Top Face Metallic Gradient -->
    <linearGradient id="goldTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="25%" stop-color="#FDE047"/>
      <stop offset="65%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>

    <!-- Front Sloped Face Gradient -->
    <linearGradient id="goldFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EAB308"/>
      <stop offset="40%" stop-color="#CA8A04"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>

    <!-- Left Bevel Shadow Gradient -->
    <linearGradient id="goldLeft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#854D0E"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>

    <!-- Right Bevel Highlight Gradient -->
    <linearGradient id="goldRight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#854D0E"/>
    </linearGradient>

    <!-- Specular Diagonal Gleam -->
    <linearGradient id="goldGleam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Ambient Contact Shadow -->
  <ellipse cx="16" cy="24.5" rx="13.5" ry="3.5" fill="#000000" fill-opacity="0.45"/>

  <!-- Front Sloped Ingot Face -->
  <polygon points="3.5,23.5 28.5,23.5 25.5,17.5 6.5,17.5" fill="url(#goldFront)"/>

  <!-- Left Sloped Bevel Face -->
  <polygon points="3.5,23.5 6.5,17.5 9,10 5,14" fill="url(#goldLeft)"/>

  <!-- Right Sloped Bevel Face -->
  <polygon points="28.5,23.5 25.5,17.5 23,10 27,14" fill="url(#goldRight)"/>

  <!-- Top Ingot Surface -->
  <polygon points="9,10 23,10 25.5,17.5 6.5,17.5" fill="url(#goldTop)"/>

  <!-- Fine Ingot Stamped Perimeter -->
  <polygon points="10,11.2 22,11.2 24,16.4 8,16.4" fill="none" stroke="#CA8A04" stroke-width="0.6" stroke-opacity="0.6"/>

  <!-- Mint Fineness Hallmarks -->
  <text x="16" y="14" font-size="2.6" font-weight="800" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" fill="#78350F" text-anchor="middle" letter-spacing="0.4">999.9</text>
  <text x="16" y="16" font-size="1.9" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" fill="#854D0E" text-anchor="middle" letter-spacing="0.3">FINE GOLD</text>

  <!-- Specular Reflection Sheen on Top-Left Corner -->
  <polygon points="9,10 14,10 11,17.5 6.5,17.5" fill="url(#goldGleam)"/>

  <!-- Crisp Polished Ridge Highlight -->
  <line x1="9" y1="10" x2="23" y2="10" stroke="#FFFBEB" stroke-width="0.75" stroke-linecap="round"/>
</svg>

